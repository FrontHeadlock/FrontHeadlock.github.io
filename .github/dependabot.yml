version: 2
updates:
  # 액션은 커밋 SHA로 고정돼 있다. Dependabot이 SHA와 주석의 버전을 함께 올린다.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    groups:
      # 마이너·패치는 한 PR로 묶고, 메이저는 따로 열어 검토한다.
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
